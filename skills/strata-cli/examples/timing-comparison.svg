<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360"><title>Timing comparison sampled from Strata's baker</title><desc>Linear motion has equal spacing. OutCubic travels quickly then settles. These are diagrams, not cloud-rendered frames.</desc><rect width="960" height="360" fill="#ffffff"/><g font-family="sans-serif" fill="#182522"><text x="20" y="28" font-size="20">Rigid card arrival: identical endpoints, different spacing</text><text x="20" y="60" font-size="18">Weak for this intention: constant speed, abrupt arrival</text><rect x="20" y="75" width="146" height="100" fill="#e7eee8"/><line x1="38" y1="140" x2="148" y2="140" stroke="#53645d"/><rect x="34.00" y="103" width="18" height="30" fill="#176345"/><text x="28" y="164" font-size="12">f0: 0.000</text><rect x="176" y="75" width="146" height="100" fill="#e7eee8"/><line x1="194" y1="140" x2="304" y2="140" stroke="#53645d"/><rect x="210.00" y="103" width="18" height="30" fill="#176345"/><text x="184" y="164" font-size="12">f4: 0.200</text><rect x="332" y="75" width="146" height="100" fill="#e7eee8"/><line x1="350" y1="140" x2="460" y2="140" stroke="#53645d"/><rect x="386.00" y="103" width="18" height="30" fill="#176345"/><text x="340" y="164" font-size="12">f8: 0.400</text><rect x="488" y="75" width="146" height="100" fill="#e7eee8"/><line x1="506" y1="140" x2="616" y2="140" stroke="#53645d"/><rect x="562.00" y="103" width="18" height="30" fill="#176345"/><text x="496" y="164" font-size="12">f12: 0.600</text><rect x="644" y="75" width="146" height="100" fill="#e7eee8"/><line x1="662" y1="140" x2="772" y2="140" stroke="#53645d"/><rect x="738.00" y="103" width="18" height="30" fill="#176345"/><text x="652" y="164" font-size="12">f16: 0.800</text><rect x="800" y="75" width="146" height="100" fill="#e7eee8"/><line x1="818" y1="140" x2="928" y2="140" stroke="#53645d"/><rect x="914.00" y="103" width="18" height="30" fill="#176345"/><text x="808" y="164" font-size="12">f20: 1.000</text><text x="20" y="215" font-size="18">Stronger for this intention: fast travel, diminishing spacing</text><rect x="20" y="230" width="146" height="100" fill="#e7eee8"/><line x1="38" y1="295" x2="148" y2="295" stroke="#53645d"/><rect x="34.00" y="258" width="18" height="30" fill="#176345"/><text x="28" y="319" font-size="12">f0: 0.000</text><rect x="176" y="230" width="146" height="100" fill="#e7eee8"/><line x1="194" y1="295" x2="304" y2="295" stroke="#53645d"/><rect x="238.80" y="258" width="18" height="30" fill="#176345"/><text x="184" y="319" font-size="12">f4: 0.488</text><rect x="332" y="230" width="146" height="100" fill="#e7eee8"/><line x1="350" y1="295" x2="460" y2="295" stroke="#53645d"/><rect x="424.40" y="258" width="18" height="30" fill="#176345"/><text x="340" y="319" font-size="12">f8: 0.784</text><rect x="488" y="230" width="146" height="100" fill="#e7eee8"/><line x1="506" y1="295" x2="616" y2="295" stroke="#53645d"/><rect x="595.60" y="258" width="18" height="30" fill="#176345"/><text x="496" y="319" font-size="12">f12: 0.936</text><rect x="644" y="230" width="146" height="100" fill="#e7eee8"/><line x1="662" y1="295" x2="772" y2="295" stroke="#53645d"/><rect x="757.20" y="258" width="18" height="30" fill="#176345"/><text x="652" y="319" font-size="12">f16: 0.992</text><rect x="800" y="230" width="146" height="100" fill="#e7eee8"/><line x1="818" y1="295" x2="928" y2="295" stroke="#53645d"/><rect x="914.00" y="258" width="18" height="30" fill="#176345"/><text x="808" y="319" font-size="12">f20: 1.000</text></g></svg>
